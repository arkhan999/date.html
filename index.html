<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Will You Go On a Date With Me?</title>

<style>
    body {
        background: linear-gradient(to bottom right, #ff9a9e, #fecfef);
        font-family: 'Arial', sans-serif;
        text-align: center;
        height: 100vh;
        overflow: hidden;
        color: white;
        transition: background 1.5s ease-in-out;
    }

    h1 {
        margin-top: 60px;
        font-size: 45px;
        text-shadow: 2px 2px 10px #ff4d6d;
        animation: glow 2s infinite alternate;
    }

    @keyframes glow {
        from { text-shadow: 0 0 10px #ff4d6d; }
        to { text-shadow: 0 0 25px #ff1e56; }
    }

    .btn {
        padding: 15px 35px;
        font-size: 24px;
        border: none;
        border-radius: 15px;
        cursor: pointer;
        margin: 20px;
        transition: 0.3s;
    }

    #yesBtn {
        background-color: #ff4d6d;
        color: white;
        box-shadow: 0 0 15px #ff4d6d;
        animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.1); }
        100% { transform: scale(1); }
    }

    #noBtn {
        background-color: #333;
        color: white;
        position: absolute;
    }

    /* Final message */
    #finalMessage {
        font-size: 45px;
        margin-top: 120px;
        opacity: 0;
        animation: fadeIn 2s forwards;
        text-shadow: 0 0 25px #ff4d6d;
    }

    @keyframes fadeIn {
        from {opacity: 0;}
        to {opacity: 1;}
    }

    /* Sparkling Samah name */
    #samahName {
        font-size: 38px;
        margin-top: 20px;
        opacity: 0;
        animation: sparkle 2s infinite alternate, fadeIn 2s forwards;
        color: #fff;
        text-shadow: 0 0 20px #ff1e56, 0 0 30px #ff4d6d;
    }

    @keyframes sparkle {
        0% { text-shadow: 0 0 10px #ff4d6d; }
        100% { text-shadow: 0 0 25px #ffffff; }
    }

    /* Floating hearts */
    .heart {
        position: absolute;
        color: #ffdde1;
        font-size: 30px;
        animation: floatUp 6s linear infinite;
        filter: drop-shadow(0 0 10px #ff4d6d);
    }

    @keyframes floatUp {
        0% {transform: translateY(0); opacity: 1;}
        100% {transform: translateY(-250px); opacity: 0;}
    }

    /* Heart burst surprise */
    .burst-heart {
        position: absolute;
        font-size: 50px;
        animation: burst 1.2s ease-out forwards;
        opacity: 0;
    }

    @keyframes burst {
        0% { transform: scale(0.2); opacity: 1; }
        100% { transform: scale(2.5); opacity: 0; }
    }
</style>
</head>
<body>

<!-- Serious tone (before Yes) -->
<audio id="seriousMusic" autoplay loop>
    <source src="https://www.computerhope.com/jargon/m/example.mp3" type="audio/mpeg">
</audio>

<!-- Happy romantic tone (after Yes) -->
<audio id="happyMusic" loop>
    <source src="https://filesamples.com/samples/audio/mp3/sample1.mp3" type="audio/mpeg">
</audio>

<h1 id="title">💖 Samah, will you go on a date with me? 💖</h1>

<button id="yesBtn" class="btn">Yes</button>
<button id="noBtn" class="btn">No</button>

<!-- Final message -->
<div id="finalMessage" style="display:none;">🎉 Yey Samah! We are dating now 😍❤️</div>

<!-- Sparkling name -->
<div id="samahName" style="display:none;">💗 Samah 💗</div>

<script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const title = document.getElementById("title");
    const finalMessage = document.getElementById("finalMessage");
    const samahName = document.getElementById("samahName");

    const seriousMusic = document.getElementById("seriousMusic");
    const happyMusic = document.getElementById("happyMusic");

    // Floating hearts
    function createHeart() {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML = "❤️";
        heart.style.left = Math.random() * window.innerWidth + "px";
        heart.style.top = window.innerHeight + "px";
        heart.style.fontSize = (Math.random() * 20 + 20) + "px";
        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 6000);
    }
    setInterval(createHeart, 400);

    // Move No button EVERY TIME (mobile + desktop)
    function moveNoBtn() {
        const x = Math.random() * (window.innerWidth - 120);
        const y = Math.random() * (window.innerHeight - 120);
        noBtn.style.left = x + "px";
        noBtn.style.top = y + "px";
    }

    noBtn.addEventListener("mouseover", moveNoBtn);
    noBtn.addEventListener("touchstart", moveNoBtn);
    noBtn.addEventListener("click", moveNoBtn);

    // Heart burst animation
    function heartBurst() {
        for (let i = 0; i < 8; i++) {
            const burst = document.createElement("div");
            burst.classList.add("burst-heart");
            burst.innerHTML = "💗";
            burst.style.left = (window.innerWidth / 2) + "px";
            burst.style.top = (window.innerHeight / 2) + "px";
            burst.style.transform = `rotate(${i * 45}deg)`;
            document.body.appendChild(burst);

            setTimeout(() => burst.remove(), 1200);
        }
    }

    // When Yes is clicked
    yesBtn.addEventListener("click", () => {

        // Switch music
        seriousMusic.pause();
        happyMusic.play();

        // Change background
        document.body.style.background = "linear-gradient(to bottom right, #ffb6c1, #ffd1dc)";

        // Hide everything
        title.style.display = "none";
        yesBtn.style.display = "none";
        noBtn.style.display = "none";

        // Show final message + sparkling name
        finalMessage.style.display = "block";
        samahName.style.display = "block";

        // Trigger heart burst
        heartBurst();
    });
</script>

</body>
</html>
